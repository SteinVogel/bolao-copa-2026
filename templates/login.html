{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Login</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p class="mt-3">Não tem conta? <a href="{{ url_for('register') }}">Faça seu cadastro</a></p>
    </div>
</div>

<div class="modal fade" id="usernameNoticeModal" tabindex="-1" aria-labelledby="usernameNoticeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="usernameNoticeModalLabel">Atenção ao criar seu usuário</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">
                    Não use endereço de e-mail como nome de usuário. Escolha um apelido ou nome simples para acessar o bolão.
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
                <a class="btn btn-primary" href="{{ url_for('register') }}">Entendi, ir para cadastro</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const registerLink = document.querySelector('a[href="{{ url_for('register') }}"]');
        const noticeModalElement = document.getElementById('usernameNoticeModal');

        if (!registerLink || !noticeModalElement || !window.bootstrap) {
            return;
        }

        registerLink.addEventListener('click', (event) => {
            event.preventDefault();
            bootstrap.Modal.getOrCreateInstance(noticeModalElement).show();
        });
    });
</script>
{% endblock %}
