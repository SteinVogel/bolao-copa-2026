{% extends "base.html" %}

{% block content %}
<h2>Jogos</h2>
<div class="row">
    {% for game in games %}
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ game.team_a }} vs {{ game.team_b }}</h5>
                <p class="card-text">{{ game.date.strftime('%d/%m/%Y %H:%M') }} - {{ game.phase }}</p>
                <a href="{{ url_for('bet', game_id=game.id) }}" class="btn btn-primary">Fazer Palpite</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
