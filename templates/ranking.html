{% extends "base.html" %}

{% block content %}
<h2>Ranking</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Posição</th>
            <th>Usuário</th>
            <th>Pontos</th>
        </tr>
    </thead>
    <tbody>
        {% for item in ranking %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ item.user.username }}</td>
            <td>{{ item.points }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
